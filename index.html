<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhamad Naufal Burhanuddin Balit — Portofolio Pribadi</title>
    <meta
      name="description"
      content="Website portofolio pribadi Muhamad Naufal Burhanuddin Balit, pengembang web modern dari Purworejo. Kenali profil, keahlian, proyek MainKode, tautan media sosial, dan kontak langsung via email."
    />
    <meta property="og:title" content="Muhamad Naufal Burhanuddin Balit — Portofolio Pribadi" />
    <meta
      property="og:description"
      content="Portofolio pribadi Muhamad Naufal Burhanuddin Balit — Pengembang Web & Kreator Digital."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mainkode-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#080B12] dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
